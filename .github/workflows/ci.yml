name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build Imaging.Metadata/Imaging.Metadata.slnx --configuration Release

      - name: Run tests
        run: dotnet test Imaging.Metadata/Imaging.Metadata.Tests/Imaging.Metadata.Tests.csproj --configuration Release
